# 실시간 YOLO 탐지 서버(yolo11n TensorRT 엔진) — Jetson Orin Nano 용 (Phase 7, D-06).
#
# 사용자가 Orin 의 이 디렉터리에서 `docker compose up -d yolo-server` 로 띄운다.
# 에이전트는 기동하지 않는다. 순서는 YOLO-RUNBOOK.md 의 "실시간 YOLO 서버 (Phase 7)" 절 참고.
#
# 이미지를 빌드하지 않는다: ultralytics 공식 Jetson 이미지에 repo 를 마운트해 서버 모듈을 그대로 실행한다.
# 엔진(models/yolo11n.engine)은 이 이미지의 TensorRT 에 묶인다 — 이미지 태그를 바꾸면 런북 6단계 export 를 다시 한다.

# 배포 디렉터리(llm_report, decision, yolo_detection)가 모두 `jetson` 이라 이름이 없으면 기본 프로젝트 이름을 공유한다.
# 그러면 여기서 `down` 할 때 다른 컨테이너를 orphan 으로 건드릴 수 있어 프로젝트 이름을 고정한다.
name: wavepilot-yolo

services:
  yolo-server:
    # L4T R35 (JetPack 5) 이면 태그를 latest-jetson-jetpack5 로 바꾼다 (런북 1단계).
    image: ultralytics/ultralytics:latest-jetson-jetpack6
    runtime: nvidia
    ipc: host

    volumes:
      - "~/wavepilot:/workspace/wavepilot"
    working_dir: /workspace/wavepilot
    environment:
      - "PYTHONPATH=."

    # 인증 없는 포트다 (프로젝트 결정: API 키 없음). 신뢰 LAN 에서만 띄우고,
    # 바인딩 주소(YOLO_BIND_ADDR)와 ufw 로 접근을 좁힌다 (런북 R4).
    # 포트 8082: 판단 모델(d1)과 보고 LLM 이 쓰는 포트와 겹치지 않게 한다.
    ports:
      - "${YOLO_BIND_ADDR:-0.0.0.0}:8082:8082"

    # 이미지에 추적기 의존성 lap 이 없을 수 있다 → 없을 때만 lapx 를 설치한다 (같은 `lap` 모듈명, 런북 3단계).
    # exec 로 서버를 셸 대신 띄워 `docker compose down` 의 종료 신호를 서버가 직접 받게 한다.
    # 정적 테스트가 json.loads 로 읽는다 — 모든 원소를 큰따옴표 문자열로 쓰는 JSON 호환 flow sequence 유지.
    command: [
      "sh", "-c",
      "python -c 'import lap' 2>/dev/null || pip install lapx; exec python -m modules.yolo_detection.remote.server --weights models/yolo11n.engine --host 0.0.0.0 --port 8082 --device 0 --imgsz 640"
    ]

    # 서버는 모델 로드·워밍업 뒤에만 리슨한다 (D-01) → /health 200 = 준비 완료.
    # 이미지에 curl 이 있다는 보장이 없어 python 으로 확인한다.
    # 엔진 로드와 (필요하면) lapx 설치에 시간이 걸려 start_period 를 넉넉히 둔다.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s

    # 8 GB 공유 메모리에서 OOM 으로 죽었을 때 재시작 루프로 Orin 을 붙잡지 않도록 자동 재시작하지 않는다.
    restart: "no"
