# 보고 LLM(Nemotron-3-Nano-4B) llama-server — Jetson Orin Nano 용 (D-08).
#
# 사용자가 Orin 의 이 디렉터리에서 `docker compose up -d llama-report` 로 띄운다.
# 에이전트는 빌드·기동하지 않는다 (D-09). 순서는 RUNBOOK.md 참고.
#
# 기동 플래그는 서버 기본값을 믿지 않고 전부 명시한다 (AI-SPEC §3):
#   - --port: master README 의 기본값이 9931 로 바뀌었다 → 8080 명시
#   - -c: 미지정이면 모델 최대(262K) 컨텍스트를 잡아 CUDA OOM → 4096 명시
#   - -np: 기본 auto 는 컨텍스트를 슬롯 여러 개로 나눈다 → 1 명시
#
# 서비스는 llama-report 하나만 둔다. 판단 모델(d1-3B) 서비스는 Phase 02.1 범위다.

services:
  llama-report:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        L4T_TAG: ${L4T_TAG:-r36.4.0}
        LLAMA_CPP_REF: ${LLAMA_CPP_REF:-v0.6.0}
        CUDA_ARCH: "87"
        BUILD_JOBS: ${BUILD_JOBS:-4}
    image: wavepilot/llama-server:v0.6.0-r36.4.0
    runtime: nvidia

    # 인증 없는 포트다. 신뢰 LAN 에서만 띄우고, 필요하면 LLAMA_BIND_ADDR 로 바인딩을 좁힌다 (RUNBOOK 8단계).
    ports:
      - "${LLAMA_BIND_ADDR:-0.0.0.0}:8080:8080"

    # 모델 디렉터리 기본값 ../../../../models (= WavePilot/models/) 는 빌드 컨텍스트(modules/llm_report/deploy/jetson) 밖이다.
    # 그래서 수 GB GGUF 가 build context 로 전송되지 않는다. 읽기 전용으로 마운트한다.
    volumes:
      - "${MODELS_DIR:-../../../../models}:/models:ro"

    # 정적 테스트가 json.loads 로 읽는다 — 모든 원소를 큰따옴표 문자열로 쓰는 JSON 호환 flow sequence 유지.
    command: [
      "-m", "/models/NVIDIA-Nemotron3-Nano-4B-Q4_K_M.gguf",
      "--alias", "nemotron-3-nano-4b",
      "--host", "0.0.0.0",
      "--port", "8080",
      "-c", "4096",
      "-np", "1",
      "-ngl", "999",
      "--jinja",
      "--chat-template-kwargs", "{\"enable_thinking\": false}"
    ]

    # 모델 로딩 중 /health 는 503, 준비되면 200 {"status":"ok"}. start_period 동안의 실패는 세지 않는다.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s

    # OOM 으로 죽었을 때 재시작 루프로 Orin 을 붙잡지 않도록 자동 재시작하지 않는다.
    restart: "no"
