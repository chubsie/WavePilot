[project]
name = "wavepilot-llm"
version = "0.1.0"
description = "LLM overwatch drone: interfaces, mocks, LLM module"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "llm: needs a running llama-server (set LLAMA_SERVER_URL)",
    "e2e: spawns operator and drone processes",
]
addopts = "-m 'not llm and not e2e'"
